name: Live checks

# Checks the live site every hour (uptime, HTTPS, security headers, TLS expiry),
# and again shortly after each deploy. A failed run emails the repo owner.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "Site to check (default: https://kamllistos.com)"
        required: false
        default: "https://kamllistos.com"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the deploy to finish
        if: github.event_name == 'push'
        run: sleep 120
      - name: Run checks
        # Pass the input via env, never inline in the script (avoids shell injection).
        env:
          SITE_URL: ${{ inputs.url || 'https://kamllistos.com' }}
        run: node scripts/check-live.mjs "$SITE_URL"
      - name: API contract tests (Postman collection via Newman)
        env:
          SITE_URL: ${{ inputs.url || 'https://kamllistos.com' }}
        run: npx -y newman@6 run public/postman/kamllistos-api.postman_collection.json --env-var "baseUrl=$SITE_URL" --reporters cli
